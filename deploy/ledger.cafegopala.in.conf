# ledger.cafegopala.in — cafe-finance route. Installed into ~/careai/site-confs/ by remote.sh.
server {
    listen 80;
    server_name ledger.cafegopala.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; allow all; default_type "text/plain"; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name ledger.cafegopala.in;

    # A VARIABLE, not a literal — same rule as avyangah-infra bin/lib.sh and
    # stacks/guhya-pos/app.fastpos.in.conf. nginx resolves a literal upstream
    # when it PARSES the config, and avyangah-infra's bin/publish.sh validates
    # every site conf in a throwaway nginx that is NOT on careai-net, where
    # "cafe-finance" does not exist. A literal fails that check and blocks every
    # infra deploy. A variable defers the lookup to request time (nginx.conf has
    # `resolver 127.0.0.11`).
    set $cafe_finance_backend "cafe-finance:8000";

    ssl_certificate     /etc/nginx/ssl/ledger.cafegopala.in-fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ledger.cafegopala.in-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # share-sheet uploads: up to 10 screenshots / PDFs in one go
    client_max_body_size 60M;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location ~ /\.(?!well-known) { deny all; access_log off; log_not_found off; }

    location / {
        proxy_pass http://$cafe_finance_backend;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
